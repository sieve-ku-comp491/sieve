services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      SIEVE_SCOPE_FILE: /etc/sieve/scope.toml
    ports:
      - "127.0.0.1:8000:8000"
    # The API reads the checkouts and SARIF files that the worker writes (docs/architecture.md,
    # volumes), and the scope file, for the scope check before a scan is queued.
    volumes:
      - sieve-data:/data:ro
      - ./scope.toml:/etc/sieve/scope.toml:ro
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy

  # Runs the scan jobs: clones the repository from the scope file and starts one analyzer
  # container per plug-in through the host's Docker Engine (docs/architecture.md, "How the
  # worker starts analyzer containers").
  worker:
    build: ./backend
    command: ["sh", "-c", "python -m app.store migrate && exec python -m app.worker"]
    env_file: .env
    environment:
      SIEVE_SCOPE_FILE: /etc/sieve/scope.toml
      SIEVE_PLUGINS_DIR: /plugins
    volumes:
      - sieve-data:/data
      - ./scope.toml:/etc/sieve/scope.toml:ro
      - ./plugins:/plugins:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - backend
      - egress
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SIEVE_API_TOKEN: ${SIEVE_API_TOKEN:-}
    networks:
      - frontend
    depends_on:
      - backend

  db:
    image: postgres:17
    env_file: .env
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The forward proxy of the Java build step: tunnels to repo.maven.apache.org:443 only
  # (docs/interfaces.md).
  # Build containers reach it on sieve-build, which has no route out, and it reaches Maven
  # Central through egress.
  maven-proxy:
    build: ./maven-proxy
    read_only: true
    # The image declares /var/log/squid and /var/spool/squid as volumes. As tmpfs mounts they
    # leave no anonymous volumes behind.
    tmpfs:
      - /tmp
      - /var/log/squid
      - /var/spool/squid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - sieve-build
      - egress

networks:
  frontend:
  # No outside access: the database can't be reached from outside the project.
  backend:
    internal: true
  # Clones of public repositories by the worker, and Maven Central for maven-proxy.
  egress:
  sieve-build:
    # A fixed name, so the worker can attach build containers to it (SIEVE_BUILD_NETWORK).
    name: sieve-build
    internal: true
    # No address of the host on the bridge. Otherwise the gateway address is the host's, and a
    # build could connect to any service on the host that listens on all addresses.
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"

volumes:
  db-data:
  # A fixed name, because the worker gives analyzer containers folders of this volume by name.
  sieve-data:
    name: sieve-data
