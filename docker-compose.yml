services:
  backend:
    build: ./backend
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    # Checkouts and SARIF files of scans (docs/architecture.md, volumes). Writable while
    # python -m app.store load-sarif runs in this service; read-only once the worker writes them.
    volumes:
      - sieve-data:/data
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SIEVE_API_TOKEN: ${SIEVE_API_TOKEN:-}
    depends_on:
      - backend

  db:
    image: postgres:17
    env_file: .env
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
  sieve-data:
