services:
  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - backend

  db:
    image: postgres:17
    env_file: .env
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The forward proxy of the Java build step: HTTPS to Maven Central only (docs/interfaces.md).
  # Build containers reach it on sieve-build, which has no route out, and it reaches Maven
  # Central through egress.
  maven-proxy:
    build: ./maven-proxy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - sieve-build
      - egress

networks:
  egress:
  sieve-build:
    # A fixed name, so the worker can attach build containers to it (SIEVE_BUILD_NETWORK).
    name: sieve-build
    internal: true

volumes:
  db-data:
