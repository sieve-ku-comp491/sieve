[project]
name = "sieve-backend"
version = "0.1.0"
requires-python = ">=3.14,<3.15"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100
# PyGoat's own code, kept as it is in its repository as test data for the adapters.
extend-exclude = ["tests/adapter_fixture"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
