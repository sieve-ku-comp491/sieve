# maven-proxy: the only way out of the sieve-build network (docs/interfaces.md, Build step).
# It allows HTTPS tunnels to Maven Central and nothing else: no other host, no other port and
# no plain HTTP. The host is matched by its name only (-n), never by a reverse DNS lookup, so
# a CONNECT to an IP address is refused.
http_port 3128

acl maven_central dstdomain -n repo.maven.apache.org
acl https_port port 443
acl CONNECT method CONNECT

http_access allow CONNECT maven_central https_port
http_access deny all

# No cache and no files of its own, because the container runs as the proxy user on a
# read-only root. The log goes to the container's output.
cache deny all
cache_mem 0 MB
digest_generation off
pinger_enable off
pid_filename none
coredump_dir /tmp
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
logfile_rotate 0
shutdown_lifetime 1 seconds
