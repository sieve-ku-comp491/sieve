# maven-proxy: the only way out of the sieve-build network (docs/interfaces.md, Build step).
# It allows CONNECT tunnels to repo.maven.apache.org on port 443 and nothing else: no other
# host name, no other port and no plain HTTP. The host is matched by its name only (-n), never
# by a reverse DNS lookup, so a CONNECT to an IP address is refused.
#
# Squid checks only the name in the CONNECT line, not the TLS server name inside the tunnel.
# repo.maven.apache.org is served by Cloudflare, so a build that opens the tunnel and then sends
# another server name can reach any site hosted on Cloudflare. We accept that: a build only
# gets public code (requirement F2), and Maven Central already serves whatever anyone publishes
# to it. Checking the server name with SslBump peek and splice would close it, but that needs a
# Squid built with OpenSSL, and this one is built with GnuTLS.
http_port 3128

acl maven_central dstdomain -n repo.maven.apache.org
acl https_port port 443
acl CONNECT method CONNECT

http_access allow CONNECT maven_central https_port
http_access deny all

# No cache and no files of its own, because the container runs as the proxy user on a
# read-only root. The log goes to the container's output.
cache deny all
cache_mem 0 MB
digest_generation off
pinger_enable off
pid_filename none
coredump_dir /tmp
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
logfile_rotate 0
shutdown_lifetime 1 seconds
