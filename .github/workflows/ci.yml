# Runs the back end tests and linters, ESLint for the front end, a secret scan
# and the version pin check on every pull request and every push to main
# (requirements N4 and N6).

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  backend:
    name: Back end (ruff, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Check whether backend/ exists
        id: detect
        run: |
          if [ -f backend/requirements-dev.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "backend/requirements-dev.txt not found, skipping ruff and pytest"
          fi

      - uses: actions/setup-python@v6
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Ruff
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: ruff check --output-format=github .

      - name: Pytest
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: pytest

  frontend:
    name: Front end (ESLint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Check whether frontend/ exists
        id: detect
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "frontend/package.json not found, skipping ESLint"
          fi

      - uses: actions/setup-node@v5
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm ci

      - name: ESLint
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run lint

  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The CLI instead of gitleaks-action, which needs a license key for
      # repositories owned by an organization.
      - name: Install Gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz

      - name: Scan the full git history
        run: ./gitleaks git . --redact --verbose --exit-code 1

  pins:
    name: Version pins
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Check images and lock files
        run: python3 scripts/check_pins.py
