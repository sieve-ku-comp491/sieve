# Serves the built React app and forwards /api to the back end
# (docs/architecture.md, service web). Only requests for localhost or
# 127.0.0.1 are answered, so another site can't reach the API through
# DNS rebinding.

server {
    listen 8080 default_server;
    server_name _;
    return 444;
}

server {
    listen 8080;
    server_name localhost 127.0.0.1;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's DNS, so nginx starts even before the back end is up.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://backend:8000;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri /index.html;
    }
}
